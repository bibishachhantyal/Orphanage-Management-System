<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us — Hope Haven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-nav">
    <div class="inner">
        <a class="brand" href="index.jsp"><span class="brand-icon">&#9825;</span> Hope Haven</a>
        <nav class="links">
            <a href="index.jsp">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="donate">Donate</a>
            <a href="login">Login</a>
            <a href="register">Register</a>
        </nav>
    </div>
</header>

<main class="page-wrap">
<div class="container">
    <div class="page-header">
        <h1>Contact us</h1>
        <p class="lead">Send a message to our team. We aim to reply within two working days.</p>
    </div>

    <div class="container-card" style="max-width:640px;margin:0 auto;">
        <p id="form-error" class="error" style="display:none;">Please fill in all fields before sending.</p>

        <form method="post" action="submitContact" id="contact-form">
            <div class="form-group">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" required maxlength="100" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required maxlength="100" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required maxlength="200">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn" style="width:100%;">Send message</button>
        </form>
    </div>

    <div class="feature-grid" style="margin-top:2rem;">
        <div class="feature-box">
            <h3>Visit</h3>
            <p>Buddhachowk, Pokhara , Nepal</p>
        </div>
        <div class="feature-box">
            <h3>Phone</h3>
            <p>+977 9814782200</p>
        </div>
        <div class="feature-box">
            <h3>Email</h3>
            <p>office@hopehaven.org</p>
        </div>
    </div>
</div>
</main>

<div id="footer-mount"></div>
<script src="js/include-footer.js"></script>
<script>
(function () {
    if (window.location.search.indexOf('error=missing') !== -1) {
        var el = document.getElementById('form-error');
        if (el) el.style.display = 'block';
    }
})();
</script>
</body>
</html>
